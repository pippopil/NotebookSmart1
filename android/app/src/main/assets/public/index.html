    <script>
      (function () {
        // Intercept Vite HMR WebSocket connection to prevent connection failure in AI Studio preview
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            var isViteHmr =
              (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1));

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                binaryType: 'blob',
                send: function () {},
                close: function () {
                  mockSocket.readyState = 3;
                },
                addEventListener: function (type, cb) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(cb);
                },
                removeEventListener: function (type, cb) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function (f) { return f !== cb; });
                  }
                },
                dispatchEvent: function () { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function () {
                if (typeof mockSocket.onopen === 'function') {
                  mockSocket.onopen(new Event('open'));
                }
                if (listeners['open']) {
                  listeners['open'].forEach(function (cb) { cb(new Event('open')); });
                }
              }, 50);
              return mockSocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Filter out Vite HMR WebSocket error logs in AI Studio preview
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) { return (a && a.message) || String(a); }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('vite-hmr') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) { return (a && a.message) || String(a); }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('vite-hmr') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          if (
            e.message &&
            (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1 || e.message.indexOf('@vite/client') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (
            e.reason &&
            (String(e.reason).indexOf('WebSocket') !== -1 || String(e.reason).indexOf('@vite/client') !== -1)
          ) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
