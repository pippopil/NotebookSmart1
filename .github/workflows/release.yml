name: Automatic GitHub Release with Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер релиза (например: v1.3.4)'
        required: true
        default: 'v1.3.4'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" 2>/dev/null || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Determine Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Production Web & PWA Assets
        run: npm run build

      - name: Sync Capacitor Android Native Project
        run: |
          npx cap sync android

      - name: Restore Persistent Android Signing Keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: notebooksmart-signing-keystore-v1

      - name: Provision Signing Keystore for In-Place APK Updates
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          elif [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NotebookSmart,OU=Mobile,O=Pippopil,L=Moscow,S=Moscow,C=RU"
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./NotebookSmart-${{ steps.vars.outputs.tag }}.apk

      - name: Archive Production PWA
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd dist && zip -r ../notebook-smart-pwa-${{ steps.vars.outputs.tag }}.zip ./* && cd ..

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 'Релиз NotebookSmart ${{ steps.vars.outputs.tag }} (APK & PWA)'
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NotebookSmart-${{ steps.vars.outputs.tag }}.apk
            notebook-smart-pwa-${{ steps.vars.outputs.tag }}.zip
            capacitor.config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
