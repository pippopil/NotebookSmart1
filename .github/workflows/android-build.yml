name: Build NotebookSmart Android APK & PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pwa-and-apk:
    name: Build PWA Web & Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" 2>/dev/null || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Extract Version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Web & PWA
        run: npm run build

      - name: Upload PWA Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-pwa-dist
          path: dist/
          retention-days: 14

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Restore Persistent Android Signing Keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: notebooksmart-signing-keystore-v1

      - name: Provision Signing Keystore for In-Place APK Updates
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          elif [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NotebookSmart,OU=Mobile,O=Pippopil,L=Moscow,S=Moscow,C=RU"
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./NotebookSmart-v${{ steps.pkg_version.outputs.version }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./NotebookSmart-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotebookSmart-debug-apk
          path: NotebookSmart-debug.apk
          retention-days: 30

      - name: Publish or Update GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          name: 'Релиз NotebookSmart ${{ steps.pkg_version.outputs.tag }} (APK & PWA)'
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            NotebookSmart-v${{ steps.pkg_version.outputs.version }}.apk
            NotebookSmart-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
