<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Radiant Background Gradient -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Warm ambient rim overlay -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Ivory Warm Notebook Page -->
    <linearGradient id="ivoryPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Soft Notebook Page Fold Shadow -->
    <linearGradient id="pageShadow" x1="0%" y1="0%" x2="10%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Spiral Rings Gradient -->
    <linearGradient id="goldSpiral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Red Bookmark Ribbon (Ляссе) -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Emerald Shopping Basket Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Warm Honey Math Grid Pattern -->
    <pattern id="warmGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#fcd34d" stroke-width="0.9" opacity="0.55"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#431407" flood-opacity="0.45"/>
    </filter>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle App Tile -->
  <rect width="512" height="512" rx="118" fill="url(#warmBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Warm Sunlit Back Ambient Circles -->
  <circle cx="120" cy="100" r="140" fill="#fef08a" opacity="0.35" filter="blur(50px)"/>
  <circle cx="410" cy="410" r="130" fill="#fb923c" opacity="0.3" filter="blur(40px)"/>

  <!-- ==================== NOTEBOOK (ТЕТРАДЬ В ТЕПЛЫХ ТОНАХ) ==================== -->
  <g filter="url(#cardShadow)">
    <!-- Back Cover Peek / Thickness -->
    <rect x="88" y="78" width="336" height="364" rx="28" fill="#78350f" opacity="0.75"/>
    <rect x="92" y="74" width="332" height="364" rx="26" fill="#9a3412" opacity="0.85"/>

    <!-- Main Ivory Notebook Page -->
    <rect x="96" y="68" width="324" height="364" rx="24" fill="url(#ivoryPage)"/>

    <!-- Subtle Notebook Grid Pattern Texture -->
    <rect x="96" y="68" width="324" height="364" rx="24" fill="url(#warmGrid)"/>

    <!-- Classical Red Margin Line (Красные поля тетради) -->
    <line x1="168" y1="68" x2="168" y2="432" stroke="#f43f5e" stroke-width="2.5" opacity="0.75"/>

    <!-- Page Fold Inner Shadow on Spiral Edge -->
    <rect x="96" y="68" width="32" height="364" rx="24" fill="url(#pageShadow)"/>

    <!-- Red Ribbon Bookmark (Ляссе) falling from top -->
    <path d="M 330 68 L 330 180 L 345 162 L 360 180 L 360 68 Z" fill="url(#ribbonGrad)" filter="url(#iconGlow)"/>
  </g>

  <!-- ==================== GOLDEN SPIRAL BINDER RINGS ==================== -->
  <g filter="url(#iconGlow)">
    <!-- Ring 1 -->
    <rect x="84" y="104" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="110" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="110" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 2 -->
    <rect x="84" y="152" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="158" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="158" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 3 -->
    <rect x="84" y="200" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="206" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="206" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 4 -->
    <rect x="84" y="248" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="254" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="254" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 5 -->
    <rect x="84" y="296" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="302" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="302" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 6 -->
    <rect x="84" y="344" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="350" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="350" r="4" fill="#fde68a" opacity="0.9"/>

    <!-- Ring 7 -->
    <rect x="84" y="392" width="28" height="12" rx="6" fill="url(#goldSpiral)"/>
    <circle cx="84" cy="398" r="4.5" fill="#451a03"/>
    <circle cx="112" cy="398" r="4" fill="#fde68a" opacity="0.9"/>
  </g>

  <!-- ==================== NOTEBOOK CONTENT / SMART SHOPPING ICON ==================== -->
  <!-- Note Lines (Handwritten styled warm dashes) -->
  <g opacity="0.6">
    <line x1="188" y1="126" x2="280" y2="126" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <line x1="188" y1="154" x2="310" y2="154" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Central Smart Shopping Emblem (Элегантная Умная Корзинка с Галочкой & Искрой) -->
  <g filter="url(#emeraldGlow)">
    <!-- Shopping Bag / Basket Body -->
    <path d="M 200 240 L 350 240 C 356 240 361 245 359 251 L 342 338 C 340 348 331 356 320 356 L 230 356 C 219 356 210 348 208 338 L 191 251 C 189 245 194 240 200 240 Z"
          fill="url(#emeraldGrad)"/>

    <!-- Basket Handles (Arch) -->
    <path d="M 235 240 C 235 204 315 204 315 240" fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 245 240 C 245 214 305 214 305 240" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Basket Front Texture Line -->
    <path d="M 206 270 Q 275 278 344 270" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing White Checkmark inside the bag -->
    <path d="M 248 298 L 268 318 L 306 274" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Warm Sparkles ✨ (Умный интеллект и авто-расчет) -->
  <g filter="url(#iconGlow)">
    <!-- Large Golden Sparkle Top Right -->
    <path d="M 380 188 Q 380 206 398 206 Q 380 206 380 224 Q 380 206 362 206 Q 380 206 380 188 Z" fill="#fde047"/>
    <circle cx="380" cy="206" r="3" fill="#ffffff"/>

    <!-- Small Sparkle Bottom Left of Bag -->
    <path d="M 178 348 Q 178 358 188 358 Q 178 358 178 368 Q 178 358 168 358 Q 178 358 178 348 Z" fill="#fbbf24"/>

    <!-- Mini Sparkle -->
    <circle cx="356" cy="378" r="4.5" fill="#fef08a"/>
    <circle cx="198" cy="214" r="3.5" fill="#fef08a"/>
  </g>

  <!-- Small Smart Math Badge / Chip (🧮 + = ∑) in Top Right of Notebook -->
  <g>
    <rect x="290" y="112" width="34" height="24" rx="7" fill="#fbbf24" opacity="0.95"/>
    <text x="307" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle">∑</text>
  </g>
</svg>
